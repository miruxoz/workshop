<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♡ ろぐ こうぼう ♡ 명령어 모음</title>
  <link rel="stylesheet" href="css/site.css?v=1121c">
</head>
<body>

<div class="page">
  <header class="top">
    <h1><img class="text-emoji" src="https://i.imgur.com/u0X82vZ.gif" alt=""> ろぐ こうぼう <img class="text-emoji" src="https://i.imgur.com/u0X82vZ.gif" alt=""></h1>
    <p>⌨ 명령어 모음 ♪ 콘솔에 붙여넣는 명령어들</p>
  </header>

  <nav class="menu">
    <a href="index.html">작업대</a>
    <a href="journal.html">📔 일지</a>
    <a href="vault.html">🗂 보관함</a>
    <a href="commands.html" class="on">♡ 명령어 ♡</a>
    <a href="emoji.html">🖼 이모지</a>
    <a href="fonts.html">🔤 폰트</a>
    <a href="lab.html">🎨 실험실</a>
    <a href="links.html">🔗 링크</a>
  </nav>

  <main class="main">
    <!-- 채팅방별 STOP -->
    <section class="win">
      <div class="win-t pink"><span>📌 채팅방별 STOP 문장</span><small id="stopDate"></small></div>
      <div class="win-b">
        <div class="cat-bar">
          <label class="lb" for="stopCat" style="flex:none">🏷 채팅방</label>
          <select class="tx sel" id="stopCat"></select>
        </div>
        <textarea class="tx" id="stopText" rows="2" placeholder="백업 패널의 「다음 STOP 문장」을 붙여넣고 저장 → 명령어를 복사할 때 자동으로 들어가요"></textarea>
        <div class="row">
          <button class="btn pink" id="stopSave">💾 STOP 저장</button>
          <button class="btn white" id="stopClear" style="flex:none">처음부터 백업 (비우기)</button>
        </div>
      </div>
    </section>

    <!-- 목록 -->
    <section class="win">
      <div class="win-t"><span>⌨ 명령어</span><span class="row" style="gap:3px"><button class="btn mini white" id="exportBtn">⤓ 내보내기</button><button class="btn mini white" id="importBtn">⤒ 가져오기</button></span></div>
      <div class="win-b">
        <div class="row">
          <input class="tx" id="q" placeholder="🔍 이름·태그로 찾기" style="flex:1">
          <button class="btn pink" id="addBtn" style="flex:none">＋ 내 명령어</button>
        </div>
        <div id="list" style="display:flex;flex-direction:column;gap:10px"></div>
        <div class="pager" id="pager"></div>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
    </section>
  </main>
  <footer class="foot">내 명령어는 이 브라우저 + (연결돼 있으면) 깃허브 보관함에 저장돼요 ♡</footer>
</div>

<script src="js/common.js?v=1121c"></script>
<script src="js/repo.js"></script>
<script src="js/vault.js"></script>
<script src="js/meta.js"></script>
<script src="data/default-commands.js"></script>
<script src="js/commands.js"></script>
<script src="js/widget.js"></script>
</body>
</html>
